# MySQL. Versions 5.7.8 and up are supported.
#
#   gem install mysql2
#
#   Ensure the MySQL gem is defined in your Gemfile
#   gem "mysql2"
#
default: &default
  adapter: mysql2
  encoding: utf8mb4
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  username: <%= ENV.fetch("DB_USERNAME") { "root" } %>
  password: <%= ENV.fetch("DB_PASSWORD") { "" } %>
  host: <%= ENV.fetch("DB_HOST") { "localhost" } %>
  port: <%= ENV.fetch("DB_PORT") { 3306 } %>

development:
  <<: *default
  database: store_development

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: store_test

production:
  primary:
    <<: *default
    database: store_production
    username: <%= ENV.fetch("STORE_DATABASE_USER") { "store" } %>
    password: <%= ENV["STORE_DATABASE_PASSWORD"] %>
    host: <%= ENV.fetch("STORE_DATABASE_HOST") { "localhost" } %>
  cache:
    <<: *default
    database: store_production_cache
    username: <%= ENV.fetch("STORE_DATABASE_USER") { "store" } %>
    password: <%= ENV["STORE_DATABASE_PASSWORD"] %>
    host: <%= ENV.fetch("STORE_DATABASE_HOST") { "localhost" } %>
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: store_production_queue
    username: <%= ENV.fetch("STORE_DATABASE_USER") { "store" } %>
    password: <%= ENV["STORE_DATABASE_PASSWORD"] %>
    host: <%= ENV.fetch("STORE_DATABASE_HOST") { "localhost" } %>
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: store_production_cable
    username: <%= ENV.fetch("STORE_DATABASE_USER") { "store" } %>
    password: <%= ENV["STORE_DATABASE_PASSWORD"] %>
    host: <%= ENV.fetch("STORE_DATABASE_HOST") { "localhost" } %>
    migrations_paths: db/cable_migrate
